<!-- Old site-wide footer code (counter animation + jQuery 2.1.3), removed 2026-11-17 at the owner's request. -->
<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
<script>
  function animateCounter(counter) {
    $(counter).prop('Counter',0).animate({ Counter: $(counter).text() }, { duration: 4000, easing: 'linear', step: function (now) { $(this).text(Math.ceil(now)); } });
  }
  const observer = new IntersectionObserver((entries, observer) => {
    entries.forEach(entry => { if(entry.isIntersecting){ animateCounter(entry.target); observer.unobserve(entry.target); } });
  }, { threshold: 0.15 });
  $('.counter').each(function() { observer.observe(this); });
</script>
